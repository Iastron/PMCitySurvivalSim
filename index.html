<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뒷골목의 나날</title>
<style>
:root{
  --bg:#0c0c0f;--panel:#15151a;--panel2:#1c1c23;--line:#2b2b35;--text:#dcd7ca;--dim:#8b877d;
  --gold:#d8b15c;--red:#cf4a40;--blue:#5a95d6;--green:#6caf5c;--purple:#a07ad8;--orange:#e1813a;--cyan:#4fb8b0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.wrap{max-width:1000px;margin:0 auto;padding:12px 16px 40px}
.hidden{display:none!important}
h1{font-size:28px;letter-spacing:4px;margin:30px 0 6px;color:var(--gold)}
.sub{color:var(--dim);margin-bottom:22px;line-height:1.7}
.dim{color:var(--dim)}

/* top bar */
#topbar{position:sticky;top:0;z-index:20;background:rgba(12,12,15,.96);border-bottom:1px solid var(--line);padding:8px 0}
.bar-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.stat{white-space:nowrap}
.stat b{color:var(--gold)}
#clock{font-weight:700}
.speed{display:flex;gap:4px;margin-left:auto}
.speed button{padding:4px 9px;font-size:13px}
.timer{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:8px}
.timer>i{display:block;height:100%;background:var(--gold);transition:width .1s linear}
.timer.night>i{background:var(--red)}
.turns{display:flex;gap:4px;margin-top:6px}
.turns span{flex:1;font-size:11px;text-align:center;padding:2px;border-radius:3px;background:var(--panel);color:var(--dim)}
.turns span.cur{background:var(--gold);color:#111;font-weight:700}
.turns span.done{color:#555}

/* log */
#log{background:var(--panel);border:1px solid var(--line);border-radius:8px;height:46vh;min-height:260px;overflow-y:auto;padding:12px 14px;margin-top:12px;line-height:1.75}
#log div{animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
.l-day{color:var(--gold);font-weight:700;margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
.l-turn{color:var(--cyan);font-weight:700;margin-top:6px}
.l-night{color:var(--red);font-weight:700;margin-top:6px}
.l-amb{color:var(--dim);font-style:italic}
.l-good{color:var(--green)}
.l-bad{color:var(--red)}
.l-sys{color:var(--purple)}
.l-choice{color:var(--gold)}

/* event */
#event{margin-top:12px;background:var(--panel2);border:1px solid var(--gold);border-radius:8px;padding:14px}
#event h3{margin:0 0 6px;color:var(--gold);font-size:17px}
#event p{margin:0 0 12px;line-height:1.7}
.choices{display:flex;flex-direction:column;gap:6px}
.choices button{text-align:left}
.choices .def{font-size:11px;color:var(--dim);margin-left:6px}
.choices .req{font-size:11px;color:var(--red);margin-left:6px}
.ev-timer{font-size:13px;color:var(--dim);margin-bottom:8px}
.ev-timer b{color:var(--red)}
#nextBtn{margin-top:10px}

/* character select */
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.char{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer}
.char:hover{border-color:var(--gold)}
.char h3{margin:0 0 2px;font-size:16px}
.char .tag{color:var(--gold);font-size:12px}
.char .pas{margin:8px 0;font-size:13px;color:var(--cyan);line-height:1.5}
.char .st{font-size:13px;color:var(--dim)}
.char .mini{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.char .mini span{font-size:11px;background:var(--panel2);border:1px solid var(--line);padding:1px 5px;border-radius:3px}

/* origin roll */
.roll-btn{font-size:17px;padding:14px 22px;border-color:var(--gold);color:var(--gold)}
#rollResult{margin-top:16px}
.origin{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:16px;max-width:640px}
.origin h2{margin:4px 0 2px;font-size:22px}
.origin .pas{margin:10px 0;color:var(--cyan);line-height:1.6}
.origin .mini{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.origin .mini span{font-size:12px;background:var(--panel2);border:1px solid var(--line);padding:2px 6px;border-radius:3px}
.tier{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:4px;color:#111}
.tier-0{background:#777}.tier-1{background:#a9a59a}.tier-2{background:var(--blue)}.tier-3{background:var(--purple)}.tier-4{background:var(--gold)}.tier-5{background:var(--red);color:#fff}
.origin.t4{border-color:var(--gold);box-shadow:0 0 18px #d8b15c55}
.origin.t5{border-color:var(--red);box-shadow:0 0 24px #cf4a4077}
.spin{font-size:22px;font-weight:800;color:var(--dim);padding:20px 0}
.odds{margin-top:18px;color:var(--dim);font-size:13px}
.odds summary{cursor:pointer}
.odds table{border-collapse:collapse;margin-top:8px}
.odds td{padding:3px 12px 3px 0}

/* cards */
.card{width:132px;min-height:150px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:4px;user-select:none;transition:transform .12s}
.card:hover{transform:translateY(-4px);border-color:var(--gold)}
.card.cant{opacity:.45}
.card .cost{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#111;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.card .nm{font-weight:700;font-size:13px;margin-left:10px;line-height:1.3}
.card .ds{font-size:11px;color:var(--dim);line-height:1.4;margin-top:auto}
.die{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 6px;border-radius:4px;background:#0006;border-left:3px solid}
.t-참격{border-color:var(--red)}.t-관통{border-color:var(--orange)}.t-타격{border-color:var(--purple)}
.t-방어{border-color:var(--blue)}.t-회피{border-color:var(--green)}
.hand{display:flex;flex-wrap:wrap;gap:12px;padding:10px 4px;min-height:170px}

/* combat */
#combat .unit{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.unit .nm{font-weight:700;font-size:16px}
.unit .desc{font-size:12px;color:var(--dim);margin:2px 0 6px}
.bars{display:grid;grid-template-columns:52px 1fr 70px;gap:4px 8px;align-items:center;font-size:12px}
.hb{height:10px;background:#000;border-radius:5px;overflow:hidden}
.hb i{display:block;height:100%;transition:width .3s}
.hb.hp i{background:var(--red)}.hb.sg i{background:var(--gold)}
.status{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:20px}
.status span{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.stagger{color:var(--gold);font-weight:800;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.intents{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.intent{background:#1d1416;border:1px solid #4a2a2e;border-radius:8px;padding:8px;width:180px}
.intent .slot{font-size:11px;color:var(--red)}
.intent .vs{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:12px;min-height:22px}
.intent .vs b{color:var(--gold)}
#clog{background:#09090b;border:1px solid var(--line);border-radius:8px;height:170px;overflow-y:auto;padding:8px 10px;font-size:13px;line-height:1.6;margin:10px 0}
.light{display:inline-flex;gap:3px;vertical-align:middle}
.light i{width:12px;height:12px;border-radius:50%;background:#333;display:inline-block}
.light i.f{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.played{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin-top:6px}
.played span{background:var(--panel2);border:1px solid var(--gold);padding:2px 8px;border-radius:4px;cursor:pointer}

/* modal */
#modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto}
#modal h3{margin:0 0 10px;color:var(--gold)}
.help{font-size:13px;line-height:1.8;color:var(--text)}
.help b{color:var(--gold)}
@media (max-width:600px){
  .card{width:calc(50% - 8px)}
  .intent{width:100%}
  .speed{margin-left:0}
}
</style>
</head>
<body>
<div id="topbar" class="hidden">
  <div class="wrap" style="padding-top:0;padding-bottom:0">
    <div class="bar-row">
      <span class="stat" id="clock"></span>
      <span class="stat">HP <b id="sHp"></b></span>
      <span class="stat">안 <b id="sMoney"></b></span>
      <span class="stat"><span id="sRole" class="dim"></span> <b id="sGrade"></b></span>
      <span class="stat">실적 <b id="sMerit"></b></span>
      <button id="deckBtn" style="padding:3px 9px;font-size:13px">덱 보기</button>
      <button id="helpBtn" style="padding:3px 9px;font-size:13px">도움말</button>
      <div class="speed">
        <button data-sp="0" title="Space">⏸ 정지</button>
        <button data-sp="1" class="on">1x</button>
        <button data-sp="2">2x</button>
        <button data-sp="4">4x</button>
        <button data-sp="8">8x</button>
      </div>
    </div>
    <div class="timer" id="timer"><i id="timerFill"></i></div>
    <div class="turns" id="turns"></div>
  </div>
</div>

<div class="wrap">
  <!-- TITLE / SELECT -->
  <section id="title">
    <h1>뒷골목의 나날</h1>
    <div class="sub">
      26개의 구로 나뉜 거대한 도시. 날개는 둥지를 품고, 둥지 바깥의 뒷골목은 방치된다.<br>
      당신이 무엇으로 태어날지는 아무도 모른다. 고아나 쥐일 수도, 둥지의 깃털이나 해결사일 수도 —<br>
      아주 드물게는 손가락의 간부, 특색, 혹은 <b style="color:var(--red)">머리의 발톱이나 조율자</b>일 수도 있다.<br>
      하루 4번의 시간대를 버티고, 실적을 쌓아 위상을 올려라.<br>
      그리고 기억할 것 — <b style="color:var(--red)">오전 3시 13분부터 4시 34분까지, 뒷골목의 밤</b>에는 어떤 규칙도 당신을 지켜주지 않는다.
    </div>
    <div id="rollArea">
      <button id="rollBtn" class="roll-btn">도시에 태어나기 — 무작위 출신 결정</button>
      <div id="rollResult"></div>
      <details class="odds"><summary>출신별 확률 보기</summary><div id="oddsTable"></div></details>
    </div>
  </section>

  <!-- DAY -->
  <section id="day" class="hidden">
    <div id="log"></div>
    <div id="event" class="hidden"></div>
    <button id="nextBtn" class="hidden">남은 시간 넘기기 ▶</button>
  </section>

  <!-- COMBAT -->
  <section id="combat" class="hidden" style="margin-top:12px">
    <div class="unit" id="eBox"></div>
    <div class="intents" id="intents"></div>
    <div id="clog"></div>
    <div class="unit" id="pBox"></div>
    <div class="played" id="played"></div>
    <div class="hand" id="hand"></div>
    <div class="ctrl">
      <button id="resolveBtn" style="border-color:var(--gold)">막 진행 ▶ (Enter)</button>
      <span class="dim" id="pileInfo" style="font-size:13px"></span>
    </div>
  </section>

  <!-- GAME OVER -->
  <section id="over" class="hidden"></section>
</div>

<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>

<script>
/* =========================================================
   유틸
========================================================= */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const OFF = t => t === '참격' || t === '관통' || t === '타격';
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* =========================================================
   데이터: 카드
   dice: [유형, 최소, 최대]
   onUse: 합 시작 시 효과 / onHit: 이 카드의 공격 주사위 적중 시 / instant: 즉시 사용 카드(fx)
========================================================= */
const CARDS = {
  // 츠바이 협회

  shi_ambush: { name: '기습', cost: 1, dice: [['관통', 2, 6]], onHit: { bleed: 2 }, desc: '적중 시 출혈 2' },
  shi_evade:  { name: '그림자 걸음', cost: 0, dice: [['회피', 3, 7]] },
  shi_vital:  { name: '급소 노리기', cost: 1, dice: [['관통', 4, 8]] },
  shi_flurry: { name: '연속 베기', cost: 1, dice: [['참격', 2, 4], ['참격', 2, 4], ['참격', 2, 4]] },
  shi_death:  { name: '사(死)의 결', cost: 2, dice: [['관통', 6, 12]], onHit: { bleed: 3 }, desc: '적중 시 출혈 3' },
  // 리우 협회
  liu_fist:   { name: '화염 주먹', cost: 1, dice: [['타격', 3, 6]], onHit: { burn: 1 }, desc: '적중 시 화상 1' },
  liu_block:  { name: '불꽃 막기', cost: 1, dice: [['방어', 3, 7]], onUse: { enemy: { burn: 1 } }, desc: '사용 시 적에게 화상 1' },
  liu_stoke:  { name: '아궁이 지피기', cost: 0, instant: true, fx: { light: 1, enemy: { burn: 2 } }, desc: '즉시: 빛 1 회복, 적에게 화상 2' },
  liu_blaze:  { name: '사방을 태우는 불꽃', cost: 2, dice: [['타격', 4, 8], ['타격', 4, 8]], onHit: { burn: 2 }, desc: '적중 시 화상 2' },

  // 쥐 출신
  rt_knife:   { name: '녹슨 칼', cost: 1, dice: [['참격', 2, 5]] },

  rt_stab:    { name: '비열한 찌르기', cost: 0, dice: [['관통', 1, 4]] },
  rt_sand:    { name: '모래 뿌리기', cost: 1, dice: [['타격', 1, 3]], onUse: { enemy: { para: 2 } }, desc: '사용 시 적에게 마비 2' },
  rt_grit:    { name: '악착같이', cost: 1, dice: [['참격', 3, 6]], onUse: { draw: 1 }, desc: '사용 시 카드 1장 뽑기' },
  // 공방 / 보상 카드
  mook_blade: { name: '묵 공방 대검', cost: 2, dice: [['참격', 6, 11]], price: 160 },
  hammer:     { name: '대장장이 망치', cost: 2, dice: [['타격', 5, 9], ['방어', 3, 5]], price: 150 },

  firstaid:   { name: '응급 처치', cost: 1, instant: true, fx: { heal: 7, draw: 1 }, desc: '즉시: 체력 7 회복, 카드 1장 뽑기', price: 80 },
  flow:       { name: '빛의 흐름', cost: 0, instant: true, fx: { light: 1, draw: 1 }, desc: '즉시: 빛 1 회복, 카드 1장 뽑기', price: 110 },
  bullet:     { name: '강화 탄환', cost: 1, dice: [['관통', 4, 9]], onHit: { burn: 1 }, desc: '적중 시 화상 1', price: 130 },
  deflect:    { name: '흘려내기', cost: 0, dice: [['회피', 4, 8]], price: 90 },
  combo:      { name: '연계 공격', cost: 1, dice: [['참격', 2, 5], ['관통', 2, 5]], price: 100 },
  tremor:     { name: '흐트러뜨리기', cost: 1, dice: [['타격', 3, 7]], onHit: { para: 1 }, desc: '적중 시 마비 1', price: 95 },
  // 고아
  or_bite:    { name: '물어뜯기', cost: 0, dice: [['관통', 1, 4]] },

  // 깃털
  fe_bag:     { name: '서류가방 휘두르기', cost: 1, dice: [['타격', 2, 5]] },

  // 조직원
  gg_knife:   { name: '조직 단검', cost: 1, dice: [['관통', 2, 6]] },
  gg_rush:    { name: '패거리 돌격', cost: 1, dice: [['참격', 2, 4], ['참격', 2, 4]] },
  gg_ink:     { name: '강화 문신 활성화', cost: 1, instant: true, fx: { nextStr: 1, draw: 1 }, desc: '즉시: 다음 막 힘 1, 카드 1장 뽑기' },
  // 1급 해결사
  top_slash:  { name: '정점의 검격', cost: 2, dice: [['참격', 7, 13], ['참격', 5, 9]] },
  top_guard:  { name: '완벽한 방어', cost: 1, dice: [['방어', 6, 11]] },
  top_counter:{ name: '역습', cost: 1, dice: [['회피', 5, 9], ['관통', 4, 8]] },
  top_pierce: { name: '일점 돌파', cost: 1, dice: [['관통', 6, 11]] },
  // 손가락 — 엄지
  th_load:    { name: '탄환 장전 사격', cost: 1, dice: [['관통', 5, 10]], onHit: { burn: 2 }, desc: '적중 시 화상 2' },

  for (const x of ORIGINS) { r -= x.w; if (r <= 0) { o = x; break; } }
  return buildOrigin(o);
}
function buildOrigin(o, fingerKey) {
  if (o.variant === 'finger') {
    const k = fingerKey || pick(FINGER_KEYS), a = AFFS[k];
    return { id: 'finger', tier: o.tier, w: o.w, name: `${a.name} 간부 출신`, aff: k, grade: 2, hp: 140, stg: 72, money: 2000, light: 4,
      trait: '간부의 무게 — 손가락에서 쌓아온 힘과 재산.', deck: FINGER_DECKS[k],
      intro: `${a.ranks[1]}. 아랫사람들은 당신의 눈을 마주치지 못한다. 손가락을 떠나는 자가 어떻게 되는지, 당신은 누구보다 잘 안다.` };
  }
  if (o.variant === 'color') {
    return { id: 'color', tier: o.tier, w: o.w, name: `특색 「${pick(COLORS)}${pick(COLOR_NOUNS)}」`, aff: 'color', grade: 1, hp: 170, stg: 85, money: 5000, light: 5,
      trait: '특색 — 하나 협회가 인정한 최고의 해결사.',
      deck: ['col_strike', 'col_strike', 'col_mark', 'col_mark', 'col_guard', 'col_guard', 'col_flash', 'col_flash', 'flow'],
      intro: '하나 협회가 당신에게 색을 부여했다. 도시의 별을 떨어뜨리는 것이 당신의 일이다.' };
  }
  if (o.aff === 'assoc') return { ...o, aff: pick(ASSOC_KEYS) };
  return { ...o };
}

/* ---------- 소속 헬퍼 ---------- */
const AFF = () => AFFS[S.aff];
const isFixer = () => !!AFF().fixer;
const faction = () => AFF().faction;
const hasHome = () => !!AFF().home;
function affName(id = S.aff, grade = S ? S.grade : 9) {
  const a = AFFS[id];
  if (a.ranks) return grade <= 2 ? a.ranks[1] : a.ranks[0];
  if (a.faction === 'assoc') return `${a.name} 해결사`;
  return a.name;
}
// 출신 특성 + 소속 패시브를 합친 훅 (함수는 합산, 배율은 곱, 수치는 합, 불리언은 OR)
function H() {
  if (!S) return {};
  if (S._h) return S._h;
  const out = {};
  for (const h of [S.ch.hooks || {}, AFF().hooks || {}]) {
    for (const k in h) {
      const v = h[k], prev = out[k];
      if (typeof v === 'function') out[k] = prev ? (...a) => (prev(...a) || 0) + (v(...a) || 0) : v;
      else if (['moneyMul', 'emoMul', 'enemyBleedMul'].includes(k)) out[k] = (prev || 1) * v;
      else if (k === 'flee') out[k] = Math.max(prev || 0, v);
      else if (typeof v === 'number') out[k] = (prev || 0) + v;
      else out[k] = prev || v;
    }
  }
  return (S._h = out);
}
function passiveText() {
  return `[출신] ${S.ch.trait}<br>[소속] ${AFF().passive}`;
}
// 소속 변경. 조직·손가락을 떠나면 추격자가 따라온다.
function changeAff(id, after) {
  if (AFF().locked) { say('머리에 속한 자는 소속을 바꿀 수 없다.', 'l-bad'); return; }
  const old = S.aff, oldF = faction();
  S.aff = id; S._h = null;
  say(`◆ 소속 변경: ${affName(old)} → <b>${affName(id)}</b>`, 'l-day');
  say(`새 패시브: ${AFF().passive}`, 'l-sys');
  (AFF().cards || []).forEach(addCard);
  if (oldF === 'gang' || oldF === 'finger') {
    say(oldF === 'finger' ? '손가락은 떠나는 자를 그냥 보내지 않는다. 등 뒤로 발소리가 따라붙는다.' : '조직은 배신자를 용서하지 않는다. 옛 동료들이 길을 막아선다.', 'l-bad');
    fight(oldF === 'finger' ? (S.grade <= 2 ? 'finger_exec' : 'thumb') : 'kong', { lethal: oldF === 'finger', win() { say('추격자를 떨쳐냈다. 이제 과거는 끊어졌다.'); after && after(); } });
  } else after && after();
}

/* =========================================================

========================================================= */
function print(text, cls = '') {
  const d = document.createElement('div');
  d.className = cls; d.innerHTML = text;
  const log = $('#log'); log.appendChild(d);
  while (log.children.length > 400) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}
// 턴 진행 중 순차 출력 큐에 추가
function say(text, cls = '') { T.queue.push([text, cls]); }

// 해결사는 'N급', 그 외 출신은 위상 단계(1~9)로 표시
function rankText() { return isFixer() ? `${S.grade}급` : `${10 - S.grade}단계`; }
function payMul() { return (1 + (9 - S.grade) * 0.25) * (1 + (H().payBonus || 0)); }
function pay(n) { return Math.round(n * payMul()); }
function gain(n) { S.money += n; say(`+${n} 안 (보유 ${S.money})`, 'l-good'); }
function spend(n) { S.money = Math.max(0, S.money - n); say(`-${n} 안 (보유 ${S.money})`, 'l-bad'); }
function heal(n) { const v = Math.min(n, S.maxHp - S.hp); S.hp += v; if (v > 0) say(`체력 +${v}`, 'l-good'); }
function hurt(n, lethal = false) {
  S.hp -= n; say(`체력 -${n}`, 'l-bad');
  if (S.hp <= 0) { if (lethal) { gameOver('뒷골목에서 숨이 끊어졌다.'); return; } S.hp = 1; say('간신히 의식을 붙잡았다.', 'l-bad'); }
}
function merit(n) {
  S.merit += n; say(`실적 +${n} (총 ${S.merit})`, 'l-sys');
  while (S.grade > 1 && S.merit >= GRADE_REQ[S.grade - 1]) {
    S.grade--; S.maxHp += 5; S.hp += 5; S.maxStg += 2;
    if (isFixer()) {
      say(`★ 하나 협회 승급 심사 통과 — ${S.grade}급 해결사가 되었다. (최대 체력 +5, 의뢰 보수 증가)`, 'l-day');
      if (S.grade === 1) say('도시가 당신의 이름을 기억하기 시작했다. 이제 특색까지 남은 것은 단 하나의 색뿐.', 'l-day');
    } else say(`★ 뒷골목에 당신의 이름이 퍼진다 — 위상 ${rankText()} (최대 체력 +5, 보수 증가)`, 'l-day');
  }
}
function addCard(id) { S.deck.push(id); say(`덱에 「${CARDS[id].name}」 추가`, 'l-good'); }

function renderTop() {
  if (!S) return;
  const t = TURNS[S.turn];
  $('#clock').innerHTML = `${S.day}일차 · <span style="color:${S.turn === 3 ? 'var(--red)' : 'var(--cyan)'}">${t.name} ${t.time}</span>`;
  const hp = S.phase === 'combat' && C ? C.P.hp : S.hp;
  $('#sHp').textContent = `${hp}/${S.maxHp}`;
  $('#sMoney').textContent = S.money;
  $('#sRole').textContent = `${S.ch.name} / ${affName()}${AFF().locked ? ' 🔒' : ''}` + (isFixer() ? '' : ' · 위상');
  $('#sGrade').textContent = rankText();
  $('#sMerit').textContent = S.grade > 1 ? `${S.merit}/${GRADE_REQ[S.grade - 1]}` : S.merit;
  $('#turns').innerHTML = TURNS.map((x, i) => `<span class="${i === S.turn ? 'cur' : i < S.turn ? 'done' : ''}">${x.name}</span>`).join('');
  $('#timer').classList.toggle('night', S.turn === 3);
  if (T) $('#timerFill').style.width = `${Math.max(0, T.timeLeft / TURN_TIME * 100)}%`;
}

function setSpeed(v) {
  if (v === 0) S.paused = !S.paused; else { S.speed = v; S.paused = false; }
  document.querySelectorAll('.speed button').forEach(b => {
    const sp = +b.dataset.sp;
    b.classList.toggle('on', sp === 0 ? S.paused : (!S.paused && sp === S.speed));
  });
  document.querySelector('.speed button[data-sp="0"]').textContent = S.paused ? '▶ 재개' : '⏸ 정지';
}

}

/* =========================================================
   턴 진행 (자동 진행 + 제한시간)
========================================================= */
function startTurn() {
  S.phase = 'day';
  const t = TURNS[S.turn];
  T = { timeLeft: TURN_TIME, queue: [], lineCd: 0, ambCd: 6, eventShown: false, awaiting: null, resolved: false };
  print(`— ${t.name} ${t.time} —`, t.cls);
  const amb = shuffle([...AMBIENT[S.turn]]);
  say(amb[0], 'l-amb'); say(amb[1], 'l-amb');
  $('#event').classList.add('hidden');
  $('#nextBtn').classList.add('hidden');
  renderTop();
}

function chooseEvent() {
  const f = faction();
  let pool = EVENTS.filter(e => !e.chainOnly && e.when.includes(S.turn) && !S.seenToday.includes(e.id)
    && (!e.fac || e.fac.includes(f)) && (!e.notFac || !e.notFac.includes(f)) && (!e.origin || e.origin.includes(S.ch.id))
    && (!e.cond || e.cond()));
  if (!pool.length) pool = EVENTS.filter(e => e.id === 'rest');
  let total = pool.reduce((a, e) => a + e.w, 0), r = Math.random() * total;
  for (const e of pool) { r -= e.w; if (r <= 0) return e; }
  return pool[pool.length - 1];
}

function showEvent(ev) {
  ev = ev || chooseEvent();
  S.seenToday.push(ev.id);
  const choices = ev.build ? ev.build() : ev.choices;
  T.awaiting = { ev, choices };
  T.eventShown = true;
  const box = $('#event');
  box.classList.remove('hidden');
  const defIdx = Math.max(0, choices.findIndex(c => c.def));
  box.innerHTML = `<h3>${ev.title}</h3><div class="ev-timer" id="evTimer"></div><p>${ev.text}</p><div class="choices">${
    choices.map((c, i) => {
      const ok = !c.req || c.req();
      return `<button data-i="${i}" ${ok ? '' : 'disabled'}>${i + 1}. ${c.t}${i === defIdx ? '<span class="def">[시간 초과 시 자동 선택]</span>' : ''}${ok ? '' : `<span class="req">(${c.reqText || '조건 불충족'})</span>`}</button>`;
    }).join('')}</div>`;
  box.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => choose(+b.dataset.i));
  updateEvTimer();
}

function updateEvTimer() {
  const el = $('#evTimer'); if (!el || !T) return;
  el.innerHTML = T.awaiting ? `결정까지 <b>${Math.ceil(T.timeLeft)}초</b>${S.paused ? ' · 일시정지 중' : ''} — 정지(Space)로 시간을 멈추고 신중히 고를 수 있다.` : '';
}

function choose(i, auto = false) {
  if (!T.awaiting || S.phase !== 'day') return;
  const { ev, choices } = T.awaiting;
  let c = choices[i];
  if (auto) {
    c = choices.find(x => x.def) || choices[0];
    if (c.req && !c.req()) c = choices.find(x => !x.req || x.req());
    print('— 시간 초과. 망설이는 사이 상황이 흘러갔다.', 'l-bad');
  }
  if (!c || (c.req && !c.req())) return;
  T.awaiting = null;
  $('#event').classList.add('hidden');
  print(`▷ ${c.t.replace(/<[^>]+>/g, '')}`, 'l-choice');
  const chain = c.fn();
  if (S.phase === 'over') return;
  if (chain && S.phase === 'day') {
    T.timeLeft = Math.max(T.timeLeft, 15);
    T.pendingChain = chain;
  } else if (S.phase === 'day') {
    T.resolved = true;
  }
  renderTop();
}

function endTurn() {
  S.turn++;
  if (S.turn > 3) {
    S.turn = 0; S.day++; S.seenToday = []; S.flags.zweiTonight = false;
    print(`${S.day}일차 — 04:34. 밤이 끝났다. 청소부들이 물러가고, 도시는 아무 일 없었다는 듯 눈을 뜬다.`, 'l-day');
    startTurn();
    if (H().dailyPay) { say('월급날이다. 세금과 관리비가 빠져나간 뒤의 숫자를 확인한다.'); gain(pay(H().dailyPay)); }
    return;
  }
  startTurn();
}

function tick() {
  if (!S || S.phase !== 'day' || S.paused || !T) return;
  const dt = 0.1 * S.speed;
  T.timeLeft -= dt;

  if (T.queue.length) {
    T.lineCd -= dt;
    if (T.lineCd <= 0 || T.timeLeft <= 0) { const [tx, cl] = T.queue.shift(); print(tx, cl); T.lineCd = LINE_GAP; }
  } else if (T.pendingChain) {
    const id = T.pendingChain; T.pendingChain = null;
    showEvent(EVENTS.find(e => e.id === id));
  } else if (!T.eventShown) {
    showEvent();
  } else if (T.resolved && T.timeLeft > 0) {
    $('#nextBtn').classList.remove('hidden');
    T.ambCd -= dt;
    if (T.ambCd <= 0) { print(pick(AMBIENT[S.turn]), 'l-amb'); T.ambCd = 9; }
  }

  if (T.timeLeft <= 0) {
    T.timeLeft = 0;
    if (!T.eventShown) showEvent();
    if (T.awaiting) choose(0, true);
    else if (!T.queue.length && !T.pendingChain && T.resolved && S.phase === 'day') endTurn();
  }
  updateEvTimer();
  renderTop();
}
setInterval(tick, 100);

/* =========================================================
   전투 (카드게임)
   - 매 막: 빛(코스트)만큼 카드 배치 → 적의 공격 예고(intent)와 순서대로 '합'
   - 합: 주사위끼리 대결. 공격 vs 공격은 높은 쪽이 그 수치만큼 피해,
         공격 vs 방어는 차이만큼 피해/흐트러짐, 공격 vs 회피는 회피 성공 시 흐트러짐 회복
   - 짝이 없는 카드는 일방 공격
   - 흐트러짐 게이지가 0이 되면 다음 막 행동 불가 + 받는 피해 2배
========================================================= */
const mkSt = () => ({ bleed: 0, burn: 0, para: 0, str: 0, end: 0, prot: 0 });

function fight(key, opts = {}) {
  const d = ENEMIES[key];
  // 일반 적은 일수와 플레이어 위상에 따라 강해진다 (상위 출신이 너무 쉽게 쓸어버리지 않도록)
  const m = (1 + 0.07 * (S.day - 1)) * (d.elite ? 1 : 1 + Math.max(0, 6 - S.grade) * 0.12);
  const E = { d, name: d.name, maxHp: Math.round(d.hp * m), maxStg: Math.round(d.stg * m), res: d.res,
    st: mkSt(), next: mkSt(), staggered: false, sr: 0, isEnemy: true };
  E.hp = E.maxHp; E.stg = E.maxStg;
  const P = { name: S.ch.colorName ? `특색 「${S.ch.colorName}」` : (AFF().locked || S.ch.id === 'color') ? S.ch.name : affName(), hp: S.hp, maxHp: S.maxHp, maxStg: S.maxStg, stg: S.maxStg, res: {},
    st: mkSt(), next: mkSt(), staggered: false, sr: 0, emo: 0, emoLv: 0, maxLight: Math.max(S.ch.light || 3, AFF().light || 0), light: Math.max(S.ch.light || 3, AFF().light || 0), lastStandUsed: false };
  C = { E, P, key, opts, round: 0, drawPile: shuffle([...S.deck]), hand: [], discard: [], played: [], intents: [], busy: false };
  S.phase = 'combat';
  $('#day').classList.add('hidden');
  $('#combat').classList.remove('hidden');
  $('#clog').innerHTML = '';
  clog(`⚔ 전투 개시 — ${E.name}`, 'l-day');
  if (d.passive) clog(`적 특성: ${d.passive}`, 'l-sys');
  drawCards(4 + (H().extraDraw || 0));
  startRound();
  window.scrollTo(0, 0);
}

function clog(text, cls = '') {
  const d = document.createElement('div'); d.className = cls; d.innerHTML = text;
  const l = $('#clog'); l.appendChild(d); l.scrollTop = l.scrollHeight;
}

// 배속/정지를 반영하는 대기
const ABORT = Symbol('abort');
async function wait(ms) {
  const c = C; let t = 0;
  while (t < ms) { await sleep(50); if (!S.paused) t += 50 * S.speed; }
  if (c && C !== c) throw ABORT;   // 전투가 중간에 바뀌면(새 게임 등) 진행 중단
}

function drawCards(n) {
  for (let i = 0; i < n; i++) {
    if (C.hand.length >= 8) break;
    if (!C.drawPile.length) { if (!C.discard.length) break; C.drawPile = shuffle(C.discard); C.discard = []; clog('덱을 다시 섞었다.', 'l-amb'); }
    C.hand.push(C.drawPile.pop());
  }
}

function startRound() {
  C.round++;
  const { P, E } = C;
  for (const u of [P, E]) { u.st.str = u.next.str; u.st.end = u.next.end; u.st.prot = u.next.prot; u.next = mkSt(); }
  if (E.d.onRound) E.d.onRound(E, P);
  if (H().roundStart) H().roundStart(P, E);
  P.light = P.maxLight;
  if (C.round > 1) drawCards((P.emoLv > 0 ? 3 : 2) + (H().extraDraw || 0));
  // 적의 행동 예고
  C.intents = [];
  if (!E.staggered) {
    const pool = shuffle([...E.d.pool]);
    for (let i = 0; i < E.d.slots; i++) C.intents.push(pool[i % pool.length]);
  }
  C.played = [];
  clog(`— 제 ${C.round}막 —`, 'l-turn');
  if (E.staggered) clog(`${E.name}은(는) 흐트러져 움직이지 못한다!`, 'l-good');
  if (P.staggered) clog('흐트러짐 상태 — 이번 막에는 카드를 낼 수 없다.', 'l-bad');
  renderCombat();
}

function playCard(hi) {
  if (C.busy || C.P.staggered) return;
  const id = C.hand[hi], c = CARDS[id];
  if (c.cost > C.P.light) { clog('빛이 부족하다.', 'l-bad'); return; }
  C.P.light -= c.cost;
  C.hand.splice(hi, 1);
  if (c.instant) {
    clog(`「${c.name}」 사용`, 'l-choice');
    applyFx(c.fx, C.P, C.E);
    C.discard.push(id);
  } else {
    const used = C.played.map(p => p.slot);
    let slot = -1;
    for (let i = 0; i < C.intents.length; i++) if (!used.includes(i)) { slot = i; break; }
    C.played.push({ id, slot });
  }
  renderCombat();
}

function unplay(pi) {
  if (C.busy) return;
  const p = C.played.splice(pi, 1)[0];
  C.P.light += CARDS[p.id].cost; C.hand.push(p.id);
  // 슬롯 재정렬: 비어있는 앞 슬롯으로 당기기
  const used = []; C.played.forEach(x => { if (x.slot >= 0) used.push(x); });
  used.forEach((x, i) => x.slot = i);
  C.played.forEach(x => { if (x.slot === -1 && used.length < C.intents.length) { x.slot = used.length; used.push(x); } });
  renderCombat();
}

function applyFx(fx, self, foe) {
  if (!fx) return;
  if (fx.light) { self.light = (self.light || 0) + fx.light; }
  if (fx.draw && self === C.P) drawCards(fx.draw);
  if (fx.heal) { const v = Math.min(fx.heal, self.maxHp - self.hp); self.hp += v; clog(`${self.name} 체력 +${v}`, 'l-good'); }
  if (fx.nextStr) self.next.str += fx.nextStr;
  if (fx.nextEnd) self.next.end += fx.nextEnd;
  if (fx.nextProt) self.next.prot += fx.nextProt;
  if (fx.enemy) for (const k in fx.enemy) { foe.st[k] += fx.enemy[k]; clog(`${foe.name}에게 ${STATUS_NAME[k]} ${fx.enemy[k]}`, 'l-sys'); }
}
function applyHit(card, atk, def) {
  const h = card.onHit; if (!h) return;
  for (const k of ['bleed', 'burn', 'para']) if (h[k]) { def.st[k] += h[k]; clog(`→ ${def.name}에게 ${STATUS_NAME[k]} ${h[k]}`, 'l-sys'); }
  if (h.healSelf) { const v = Math.min(h.healSelf, atk.maxHp - atk.hp); atk.hp += v; if (v) clog(`→ ${atk.name} 체력 +${v} 흡수`, 'l-bad'); }
}

function roll(u, die, foe) {
  const [type, min, max] = die;
  let v;
  if (u.st.para > 0) { v = min; u.st.para--; } else v = rnd(min, max);
  if (OFF(type)) {
    v += u.st.str;
    if (u.st.bleed > 0) {
      const b = u.st.bleed * (u === C.E ? (H().enemyBleedMul || 1) : 1);
      u.hp -= b; u.st.bleed = Math.floor(u.st.bleed * 2 / 3);
      clog(`${u.name} 출혈로 ${b} 피해`, u === C.P ? 'l-bad' : 'l-good');
      lastStand(u);
    }
  } else v += u.st.end;
  if (u === C.P && H().rollBonus) v += H().rollBonus(u, die, foe);
  return Math.max(0, v);
}

function dmg(t, amount, type) {
  const res = (t.res && t.res[type]) || 1;
  const mult = res * (t.staggered ? 2 : 1);
  const hp = Math.max(0, Math.round(amount * mult) - t.st.prot);
  t.hp -= hp;
  lastStand(t);
  const resTxt = (res > 1 ? ' (취약)' : res < 1 ? ' (내성)' : '') + (t.staggered ? ' (흐트러짐 ×2)' : '');
  clog(`→ ${t.name}에게 <b>${hp}</b> 피해${resTxt}`, t === C.P ? 'l-bad' : 'l-good');
  if (amount > 0) stgDmg(t, Math.round(amount * (type === '타격' ? 1.5 : 1)));
}
// 패시브: 전투마다 1번 치명상을 체력 1로 버팀
function lastStand(u) {
  if (u === C.P && u.hp <= 0 && H().lastStand && !u.lastStandUsed) {
    u.hp = 1; u.lastStandUsed = true; clog('✦ 버텨냈다 — 체력 1로 살아남았다!', 'l-day');
  }
}
function stgDmg(t, n) {
  if (t.staggered || n <= 0) return;
  t.stg -= n;
  if (t.stg <= 0) {
    t.stg = 0; t.staggered = true; t.sr = 0;
    clog(`✦ ${t.name} 흐트러짐! (다음 막 행동 불가, 받는 피해 2배)`, 'l-day');
    if (t === C.E) gainEmo(2);
  }
}
function gainEmo(n) {
  const P = C.P; P.emo += n * (H().emoMul || 1);
  const th = [3, 7, 12, 18];
  while (P.emoLv < th.length && P.emo >= th[P.emoLv]) {
    P.emoLv++; P.maxLight = Math.min(Math.max(6, S.ch.light || 0), P.maxLight + 1);
    clog(`감정 단계 ${P.emoLv} — 최대 빛 +1`, 'l-sys');
  }
}

const dieHtml = (d, v) => `<span class="die t-${d[0]}">${d[0]} ${v !== undefined ? `<b>${v}</b>` : `${d[1]}-${d[2]}`}</span>`;
function diceText(c) { return c.dice ? c.dice.map(d => `${d[0]} ${d[1]}-${d[2]}`).join(', ') : (c.desc || ''); }

async function clash(pc, ec) {
  const { P, E } = C;
  clog(`⚔ 합: 「${pc.name}」 vs 「${ec.name}」`, 'l-choice');
  if (pc.onUse) applyFx(pc.onUse, P, E);
  if (ec.onUse) applyFx(ec.onUse, E, P);
  const pd = [...pc.dice], ed = [...ec.dice];
  while (pd.length || ed.length) {
    if (dead()) return;
    const a = P.staggered ? null : pd.shift(), b = E.staggered ? null : ed.shift();
    if (P.staggered) pd.length = 0;
    if (E.staggered) ed.length = 0;
    if (!a && !b) break;
    await wait(420);
    if (a && b) clashDie(a, pc, b, ec);
    else if (a) oneSide(P, a, pc, E);
    else oneSide(E, b, ec, P);
    renderCombat();
  }
}

function clashDie(a, pc, b, ec) {
  const { P, E } = C;
  const ra = roll(P, a, E), rb = roll(E, b, P);
  clog(`${dieHtml(a, ra)} vs ${dieHtml(b, rb)}`);
  const ao = OFF(a[0]), bo = OFF(b[0]);
  if (ao && bo) {
    if (ra > rb) { clog('합 승리!', 'l-good'); dmg(E, ra, a[0]); applyHit(pc, P, E); gainEmo(1); shiPassive(); }
    else if (ra === rb && H().tieWin) { clog('결전의 예 — 동률 승리!', 'l-good'); dmg(E, ra, a[0]); applyHit(pc, P, E); gainEmo(1); shiPassive(); }
    else if (rb > ra) { clog('합 패배', 'l-bad'); dmg(P, rb, b[0]); applyHit(ec, E, P); }
    else clog('상쇄');
  } else if (ao && !bo) attackVsDef(P, a, ra, pc, E, b, rb, true);
  else if (!ao && bo) attackVsDef(E, b, rb, ec, P, a, ra, false);
  else clog('서로 방어 — 아무 일도 없었다.', 'l-amb');
}
function attackVsDef(atk, ad, ra, acard, def, dd, rd, playerAttacks) {
  if (dd[0] === '방어') {
    if (ra > rd) { dmg(def, ra - rd, ad[0]); applyHit(acard, atk, def); if (playerAttacks) { gainEmo(1); shiPassive(); } }
    else if (rd > ra) { clog(`방어 성공 — ${atk.name} 흐트러짐 피해 ${rd - ra}`, playerAttacks ? 'l-bad' : 'l-good'); stgDmg(atk, rd - ra); if (!playerAttacks) gainEmo(1); }
    else clog('막아냈다.');
  } else { // 회피
    if (rd >= ra) { clog(`회피 성공 — ${def.name} 흐트러짐 ${rd} 회복`, playerAttacks ? 'l-bad' : 'l-good'); if (!def.staggered) def.stg = Math.min(def.maxStg, def.stg + rd); if (!playerAttacks) gainEmo(1); }
    else { dmg(def, ra, ad[0]); applyHit(acard, atk, def); if (playerAttacks) { gainEmo(1); shiPassive(); } }
  }
}
function shiPassive() { if (H().onClashWin) H().onClashWin(C.P, C.E); }

function oneSide(atk, die, card, def) {
  if (!OFF(die[0])) { clog(`${atk.name}의 ${die[0]} 주사위 — 상대가 없어 소멸`, 'l-amb'); return; }
  const r = roll(atk, die, def);
  clog(`일방 공격 ${dieHtml(die, r)}`);
  dmg(def, r, die[0]); applyHit(card, atk, def);
}

const dead = () => C.P.hp <= 0 || C.E.hp <= 0;

async function resolveRound() {
  if (!C || C.busy) return;
  try { await resolveRoundInner(); } catch (e) { if (e !== ABORT) throw e; }
}
async function resolveRoundInner() {
  C.busy = true; renderCombat();
  const { P, E } = C;
  // 1) 적 예고 순서대로 합 / 일방 공격
  for (let i = 0; i < C.intents.length; i++) {
    if (dead()) break;
    const ec = C.intents[i];
    const pair = C.played.find(p => p.slot === i);
    await wait(350);
    if (E.staggered) break;
    if (pair && !P.staggered) await clash(CARDS[pair.id], ec);
    else {
      clog(`⚠ 「${ec.name}」 — 막지 못했다! 일방 공격`, 'l-bad');
      if (ec.onUse) applyFx(ec.onUse, E, P);
      for (const d of ec.dice) { if (dead() || E.staggered) break; await wait(380); oneSide(E, d, ec, P); renderCombat(); }
    }
  }
  // 2) 남은 플레이어 카드 일방 공격
  for (const p of C.played.filter(p => p.slot === -1)) {
    if (dead() || P.staggered) break;
    const pc = CARDS[p.id];
    await wait(350);
    clog(`➤ 「${pc.name}」 일방 공격`, 'l-choice');
    if (pc.onUse) applyFx(pc.onUse, P, E);
    for (const d of pc.dice) { if (dead() || P.staggered) break; await wait(380); oneSide(P, d, pc, E); renderCombat(); }
  }
  C.played.forEach(p => C.discard.push(p.id));
  C.played = [];
  // 3) 막 종료 처리
  if (!dead()) {
    await wait(300);
    for (const u of [P, E]) {
      if (u.st.burn > 0) { const b = u.st.burn; u.hp -= b; u.st.burn = Math.floor(b / 2); lastStand(u); clog(`${u.name} 화상으로 ${b} 피해`, u === P ? 'l-bad' : 'l-good'); }
      if (u.staggered) { u.sr++; if (u.sr >= 2) { u.staggered = false; u.stg = u.maxStg; clog(`${u.name} 흐트러짐에서 회복`, 'l-sys'); } }
    }
  }
  C.busy = false;
  if (E.hp <= 0) return endCombat(true);
  if (P.hp <= 0) return endCombat(false);
  startRound();
}

function endCombat(win) {
  const { P, opts } = C;
  S.hp = Math.max(0, Math.min(P.hp, S.maxHp));
  $('#combat').classList.add('hidden');
  $('#day').classList.remove('hidden');
  S.phase = 'day';
  T.timeLeft = Math.max(T.timeLeft, 8);
  if (win) {
    S.kills++;
    print(`⚔ 승리 — ${C.E.name}을(를) 쓰러뜨렸다.`, 'l-good');
    const [a, b] = C.E.d.reward;
    let money = pay(rnd(a, b)); money = Math.round(money * (H().moneyMul || 1));
    gain(money);
    S.hp = Math.max(S.hp, 1);
    opts.win && opts.win();
    T.resolved = true;
    rewardModal(opts.rare);
  } else {
    if (opts.lethal === false) {
      print('⚔ 패배 — 정신을 잃었다. 깨어나 보니 주머니가 가벼워져 있다.', 'l-bad');
      S.hp = 1; spend(Math.floor(S.money / 2));
      opts.lose && opts.lose();
      T.resolved = true;
    } else {
      gameOver(`${C.E.name}에게 패배했다.`);
    }
  }
  C = null;
  renderTop();
}

function rewardModal(rare) {
  const opts = shuffle([...SHOP_POOL]).slice(0, 3);
  if (rare && Math.random() < 0.5) opts[0] = 'ego';
  S.pausedByModal = !S.paused; if (!S.paused) setSpeed(0);
  openModal(`<h3>전리품 — 카드 1장을 선택하세요</h3>
    <div class="hand">${opts.map((id, i) => cardHtml(id, `data-r="${i}"`)).join('')}</div>
    <button id="skipReward">받지 않는다</button>`);
  const close = () => { closeModal(); if (S.pausedByModal) setSpeed(0); };
  document.querySelectorAll('#modalBox .card').forEach(el => el.onclick = () => { S.deck.push(opts[+el.dataset.r]); print(`덱에 「${CARDS[opts[+el.dataset.r]].name}」 추가`, 'l-good'); close(); });
  $('#skipReward').onclick = close;
}

/* ---------- 전투 렌더링 ---------- */
function cardHtml(id, attr = '', cant = false) {
  const c = CARDS[id];
  return `<div class="card ${cant ? 'cant' : ''}" ${attr}>
    <div class="cost">${c.cost}</div>
    <div class="nm">${c.name}${c.rare ? ' ★' : ''}</div>
    ${c.dice ? c.dice.map(d => `<div>${dieHtml(d)}</div>`).join('') : '<div class="dim" style="font-size:12px">즉시 사용</div>'}
    <div class="ds">${c.desc || ''}</div></div>`;
}
function statusHtml(u) {
  return Object.keys(STATUS_NAME).filter(k => u.st[k] > 0).map(k => `<span title="${STATUS_DESC[k]}">${STATUS_NAME[k]} ${u.st[k]}</span>`).join('')
    + (u.next.str ? `<span title="다음 막 적용">다음 막 힘 ${u.next.str}</span>` : '')
    + (u.next.end ? `<span title="다음 막 적용">다음 막 인내 ${u.next.end}</span>` : '')
    + (u.staggered ? '<span class="stagger">흐트러짐</span>' : '');
}
function barsHtml(u) {
  return `<div class="bars">
    <span>체력</span><div class="hb hp"><i style="width:${Math.max(0, u.hp / u.maxHp * 100)}%"></i></div><span>${Math.max(0, u.hp)}/${u.maxHp}</span>
    <span>흐트러짐</span><div class="hb sg"><i style="width:${u.stg / u.maxStg * 100}%"></i></div><span>${u.stg}/${u.maxStg}</span></div>`;
}
function renderCombat() {
  if (!C) return;
  const { P, E } = C;
  const resTxt = Object.entries(E.res).map(([k, v]) => `${k} ${v > 1 ? '취약' : v < 1 ? '내성' : '보통'}`).join(' · ');
  $('#eBox').innerHTML = `<div class="nm">${E.name}</div><div class="desc">${E.d.desc}<br>저항: ${resTxt}${E.d.passive ? ` · 특성: ${E.d.passive}` : ''}</div>${barsHtml(E)}<div class="status">${statusHtml(E)}</div>`;
  $('#intents').innerHTML = C.intents.length ? C.intents.map((ec, i) => {
    const pair = C.played.find(p => p.slot === i);
    return `<div class="intent"><div class="slot">예고 ${i + 1}</div><b>${ec.name}</b><div>${ec.dice.map(d => dieHtml(d)).join(' ')}</div>
      ${ec.desc ? `<div class="dim" style="font-size:11px">${ec.desc}</div>` : ''}
      <div class="vs">${pair ? `합: <b>${CARDS[pair.id].name}</b>` : '<span class="l-bad">막는 카드 없음 → 일방 공격</span>'}</div></div>`;
  }).join('') : '<div class="dim">적이 행동하지 않는다.</div>';
  $('#pBox').innerHTML = `<div class="nm">${P.name} <span class="dim" style="font-size:12px">${rankText()}</span></div>
    <div class="desc">${passiveText()}</div>${barsHtml(P)}
    <div style="margin-top:6px;font-size:13px">빛 <span class="light">${Array.from({ length: P.maxLight }, (_, i) => `<i class="${i < P.light ? 'f' : ''}"></i>`).join('')}</span>
    &nbsp; 감정 단계 ${P.emoLv} <span class="dim">(${P.emo})</span></div><div class="status">${statusHtml(P)}</div>`;
  $('#played').innerHTML = C.played.length ? '배치: ' + C.played.map((p, i) =>
    `<span data-p="${i}" title="클릭하여 취소">${CARDS[p.id].name} → ${p.slot >= 0 ? `예고 ${p.slot + 1} 합` : '일방 공격'} ✕</span>`).join('') : '<span class="dim" style="border:0">카드를 클릭해 배치하세요. 예고 순서대로 합을 겨룹니다. (배치된 카드 클릭 시 취소)</span>';
  $('#hand').innerHTML = C.hand.map((id, i) => cardHtml(id, `data-h="${i}"`, CARDS[id].cost > P.light || P.staggered)).join('');
  $('#hand').querySelectorAll('.card').forEach(el => el.onclick = () => playCard(+el.dataset.h));
  $('#played').querySelectorAll('span[data-p]').forEach(el => el.onclick = () => unplay(+el.dataset.p));
  $('#resolveBtn').disabled = C.busy;
  $('#pileInfo').textContent = `덱 ${C.drawPile.length} · 버린 카드 ${C.discard.length} · 손패 ${C.hand.length}/8`;
  renderTop();
}
$('#resolveBtn').onclick = () => C && resolveRound();

    <span class="tier tier-${ch.tier}">${TIER_NAME[ch.tier]}</span> <span class="dim" style="font-size:12px">확률 ${p.toFixed(p < 1 ? 2 : 1)}%</span>
    <h2>${ch.name}</h2>
    <div class="dim">소속: <b style="color:var(--text)">${affName(ch.aff, ch.grade)}</b> · ${a.fixer ? `${ch.grade}급 해결사` : `위상 ${10 - ch.grade}단계`}
      ${a.locked ? '<br><span class="l-bad">🔒 머리 소속 — 소속을 옮길 수 없다</span>' : '<br><span class="l-good">소속은 이벤트로 옮길 수 있다</span>'}</div>
    <div style="margin-top:10px;line-height:1.7">${ch.intro}</div>
    <div class="pas">[출신] ${ch.trait}<br>[소속] ${a.passive}</div>
    <div class="dim" style="font-size:13px">체력 ${ch.hp} · 흐트러짐 ${ch.stg} · 빛 ${Math.max(ch.light || 3, a.light || 0)} · 자금 ${ch.money}안${a.home ? ' · 거처 있음' : ''}</div>
    <div class="mini">${[...new Set(ch.deck)].map(id => `<span>${CARDS[id].name}</span>`).join('')}</div>
    <button id="startBtn" style="margin-top:10px;border-color:var(--gold)">이 삶으로 시작한다</button></div>`;
  $('#startBtn').onclick = () => newGame(ch);
};
</script>
</body>
</html>
